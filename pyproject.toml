[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[project]
name = "creed-backend"
version = "0.1.0"
description = "API do CREED.ai Educa — Matriz CREED, dashboards e prognósticos"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "email-validator>=2.2.0",
    "sqlalchemy>=2.0.36",
    "alembic>=1.14.0",
    "asyncpg>=0.30.0",
    "psycopg[binary]>=3.2.0",
    "httpx>=0.27.0",
    "pyjwt[crypto]>=2.9.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.7.0",
    "mypy>=1.13.0",
    "pre-commit>=4.0.0",
]

[tool.ruff]
target-version = "py312"
line-length = 90

[tool.ruff.lint]
# Conjunto abrangente: a referência técnica revisa código e quer o máximo
# de verificação estática local (mesmo critério do ADR-003 para o front).
select = [
    "E", "W",    # pycodestyle
    "F",         # pyflakes
    "I",         # isort
    "N",         # pep8-naming
    "UP",        # pyupgrade
    "B",         # bugbear
    "C4",        # comprehensions
    "SIM",       # simplify
    "ANN",       # anotações de tipo
    "ASYNC",     # armadilhas de async
    "S",         # bandit (segurança)
    "RUF",
]
ignore = ["ANN401"]

[tool.ruff.lint.isort]
# `alembic` é a biblioteca de terceiros, não o diretório de migrations homônimo
# na raiz — sem isto o isort o trata como pacote local e reordena errado.
known-third-party = ["alembic"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "ANN"]        # assert é esperado em teste
"alembic/versions/*" = ["ANN", "E501"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = "alembic.*"
ignore_errors = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
