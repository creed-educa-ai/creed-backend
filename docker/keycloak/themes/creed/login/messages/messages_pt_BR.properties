# Mensagens do tema `creed` em português. Aqui fica só o que muda em relação ao
# `base` (o resto vem de lá) e as chaves novas, que começam com "creed". Os textos do
# painel e dos idiomas são os mesmos do creed-frontend (src/i18n/locales).
#
# O Keycloak passa cada texto pelo MessageFormat do Java: apóstrofo vira '' e chave
# ({, }) só para parâmetro.

creedIdioma=Idioma
creedIdioma.pt-BR=Português
creedIdioma.en=Inglês
creedIdioma.es=Espanhol

creedPainelTitulo=Que bom ter você aqui.
creedPainelDescricao=Avaliação de competências que mostra o seu time com clareza, sem planilha e sem achismo.

# Definir a senha: a mesma página no convite e na redefinição.
updatePasswordTitle=Defina sua senha
creedSubtituloSenha=Escolha a senha que você vai usar para entrar na plataforma.
creedSubtituloSenhaComEmail=Escolha a senha que você vai usar para entrar com {0}.
passwordNew=Nova senha
passwordConfirm=Confirme a nova senha
creedSenhaNovaPlaceholder=Digite a nova senha
creedSenhaConfirmacaoPlaceholder=Repita a nova senha
creedSenhaMinimo=Use pelo menos {0} caracteres.
showPassword=Mostrar senha
hidePassword=Ocultar senha
creedSalvarSenha=Salvar senha

# Ao abrir o link do e-mail, antes de definir a senha.
creedConfirmarAcaoTitulo=Falta só um passo
confirmExecutionOfActions=Para acessar a plataforma, conclua esta etapa
requiredAction.UPDATE_PASSWORD=Definir senha
proceedWithAction=Continuar

# Depois de salvar a senha.
accountUpdatedMessage=Tudo certo com o seu acesso.
creedContaAtualizadaTexto=Volte para a tela de login e entre com o seu e-mail e a nova senha.
creedIrParaLogin=Ir para o login
backToApplication=Voltar para a plataforma

# Erro.
errorTitle=Não foi possível continuar
creedPedirNovoLink=Pedir um novo link

# Link do e-mail já usado ou vencido. O texto do `base` manda "continuar com o login",
# mas quem ainda não definiu a senha não tem com o que entrar.
expiredActionMessage=Este link já foi usado ou não vale mais. Se você já definiu a senha, é só entrar. Se não, peça um novo link.
expiredActionTokenNoSessionMessage=Este link já foi usado ou não vale mais. Se você já definiu a senha, é só entrar. Se não, peça um novo link.
expiredActionTokenSessionExistsMessage=Este link já foi usado ou não vale mais. Se você já definiu a senha, é só entrar. Se não, peça um novo link.
