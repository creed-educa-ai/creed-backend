# Tema de login do realm `creed`: as páginas que o Keycloak mostra para a pessoa
# (definir a senha pelo link do convite ou da redefinição, e os avisos em volta).
#
# Herda do `base`, que traz os templates e as mensagens sem nenhum CSS, e não do
# `keycloak.v2`, que traz o PatternFly: com ele, cada regra daqui brigaria com a do
# PatternFly. O visual é o do AuthLayout do creed-frontend, escrito à mão em
# resources/css/creed.css com os mesmos tokens do src/index.css de lá.
parent=base

styles=css/creed.css

# Endereço do front, para os links "Ir para o login" e "Pedir um novo link" das
# páginas de erro. Vem do ambiente do container, a mesma variável que o realm usa no
# redirect do client (docker-compose.yml). Vazia, as páginas mostram só o texto.
creedFrontendUrl=${env.CREED_FRONTEND_URL:}

# As classes que os templates do `base` pedem por nome. Só as que as páginas do
# CREED usam, mais as do formulário genérico, para que uma página do `base` que não
# foi reescrita aqui (login.ftl, por exemplo) não apareça sem estilo nenhum.
kcHtmlClass=creed
kcBodyClass=creed-body
kcFormClass=creed-form
kcFormGroupClass=creed-campo
kcLabelClass=creed-rotulo
kcInputClass=creed-input
kcInputGroup=creed-input-group
kcInputErrorMessageClass=creed-erro-campo
kcFormOptionsClass=creed-opcoes
kcFormButtonsClass=creed-acoes
kcFormSettingClass=creed-opcoes
kcCheckboxInputClass=creed-checkbox
kcButtonClass=creed-botao
kcButtonPrimaryClass=creed-botao-primario
kcButtonDefaultClass=creed-botao-contorno
kcButtonSecondaryClass=creed-botao-contorno
kcButtonBlockClass=creed-botao-bloco

# Olho de mostrar/ocultar a senha. O passwordVisibility.js do `base` troca a classe
# do ícone a cada clique: "Show" é o ícone com a senha escondida (olho riscado, como
# no LoginView do front) e "Hide", com ela à mostra.
kcFormPasswordVisibilityButtonClass=creed-botao-olho
kcFormPasswordVisibilityIconShow=creed-icone creed-icone-olho-fechado
kcFormPasswordVisibilityIconHide=creed-icone creed-icone-olho
