# Mensagens dos e-mails do tema `creed` em português. Mesma regra do tema de login
# (login/messages): só o que muda em relação ao `base` e as chaves novas, com
# "creed" na frente. O Keycloak passa cada texto pelo MessageFormat do Java:
# apóstrofo vira '' e chave ({, }) só para parâmetro.
#
# {0} do nome da plataforma chega com um espaço invisível depois do ponto
# (html/template.ftl explica).

# O assunto não vira link em cliente nenhum: pode levar o nome solto.
executeActionsSubject=Defina sua senha de acesso ao CREED.ai
requiredAction.UPDATE_PASSWORD=Definir senha

creedEmailSenhaTitulo=Defina sua senha
creedEmailSenhaTexto=Recebemos um pedido para definir a senha da sua conta no {0}. Use o botão abaixo para escolher a sua senha.
creedEmailSenhaBotao=Definir minha senha

# Só se o e-mail pedir outra ação além da senha, o que o CREED não faz hoje.
creedEmailAcoesTitulo=Atualize sua conta
creedEmailAcoesTexto=Para continuar usando o {0}, conclua esta etapa: {1}.
creedEmailAcoesBotao=Atualizar minha conta

creedEmailValidade=O link vale por {0} e só pode ser usado uma vez.
creedEmailLinkManual=Se o botão não funcionar, copie e cole este endereço no navegador:
creedEmailIgnorar=Se você não esperava este e-mail, pode ignorá-lo: nada muda na sua conta.
creedEmailRodape=Este é um e-mail automático do {0}. Não é preciso responder.
