# Desenvolvimento local. Em produção o banco é RDS gerenciado (ADR-001).
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: creed
      POSTGRES_PASSWORD: creed
      POSTGRES_DB: creed
    # POSTGRES_PORT é a porta do HOST, não a do container (que continua 5432
    # pra dentro da rede do compose — Keycloak e N8N abaixo não mudam). Existe
    # pra quem já tem outro Postgres/projeto ocupando a 5432 na máquina.
    ports: ['${POSTGRES_PORT:-5432}:5432']
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Cria o schema `keycloak`. Só roda quando o volume nasce vazio — quem já
      # tem o pgdata precisa de um `docker compose down -v` uma vez.
      - ./docker/postgres/init-keycloak-schema.sql:/docker-entrypoint-initdb.d/10-keycloak-schema.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U creed']
      interval: 10s
      retries: 5

  # Autenticação (CREED-23, decisões D1 e D3). O realm é ARQUIVO versionado e
  # importado no boot: nada aqui se configura clicando na UI, senão dev e produção
  # divergem sem ninguém perceber.
  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    command: start-dev --import-realm
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://db:5432/creed
      KC_DB_SCHEMA: keycloak
      KC_DB_USERNAME: creed
      KC_DB_PASSWORD: creed
      # Placeholders do realm-creed.json. O arquivo é público e é o mesmo que a
      # produção importa: segredo e exigência de HTTPS chegam pelo ambiente, nunca
      # escritos nele. Sem prefixo KC_ porque o Keycloak lê KC_* como config própria.
      CREED_BACKEND_CLIENT_SECRET: creed-local-secret
      CREED_REALM_SSL_REQUIRED: none
      # SMTP do realm (ADR-0006): no local, o Mailpit, sem autenticação nem TLS.
      # Em produção é o Gmail do projeto, com STARTTLS (creed-infrastructure/ec2).
      SMTP_HOST: mailpit
      SMTP_PORT: '1025'
      SMTP_FROM: nao-responda@creed.local
      SMTP_AUTH: 'false'
      SMTP_STARTTLS: 'false'
      SMTP_SSL: 'false'
      SMTP_USER: ''
      SMTP_PASSWORD: ''
      # Para onde o link "voltar" da página do convite leva (P-051): o front local.
      CREED_FRONTEND_URL: http://localhost:5173
    ports: ['8080:8080']
    volumes:
      - ./docker/keycloak/realm-creed.json:/opt/keycloak/data/import/realm-creed.json:ro
      # Tema das páginas que a pessoa vê no Keycloak (definir a senha) e do e-mail do
      # convite. O start-dev não guarda tema em cache: mudou um arquivo da pasta, é só
      # recarregar a página ou mandar outro e-mail.
      - ./docker/keycloak/themes/creed:/opt/keycloak/themes/creed:ro
    depends_on:
      db: {condition: service_healthy}

  n8n:
    # Versão fixa, a mesma da produção (creed-infrastructure/ec2/docker-compose.yml).
    # Os workflows são montados no N8N da EC2 e exportados para o git: importar no
    # local um workflow de versão mais nova pode falhar. Atualizar = trocar nos dois.
    image: n8nio/n8n:2.43.4
    environment:
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: db
      DB_POSTGRESDB_DATABASE: creed
      DB_POSTGRESDB_USER: creed
      DB_POSTGRESDB_PASSWORD: creed
      DB_POSTGRESDB_SCHEMA: n8n
      N8N_SECURE_COOKIE: 'false'
    ports: ['5678:5678']
    volumes: [n8ndata:/home/node/.n8n]
    depends_on:
      db: {condition: service_healthy}

  # Worker da esteira de insights (ADR-0010, item 3): a mesma imagem do back, outro
  # comando. No local não há esteira (o N8N existe só na AWS, adendo A7): a URL vazia
  # faz o worker avisar "esteira desligada" e ficar parado. O perfil o deixa fora do
  # `docker compose up` de sempre; ele sobe com `docker compose up insight-worker`.
  insight-worker:
    build: .
    command: python -m app.workers.insights
    profiles: [esteira]
    env_file: .env
    environment:
      # Dentro da rede do compose o banco é `db:5432`, não a porta do host do .env.
      POSTGRES_HOST: db
      POSTGRES_PORT: '5432'
      # Vazia mesmo que o .env tenha uma URL: um .env copiado do exemplo antigo
      # apontava para um N8N local que não existe.
      N8N_WEBHOOK_URL: ''
    # O SIGTERM deixa o ciclo em curso terminar. Com o N8N fora, um ciclo leva até
    # INSIGHT_WORKER_BATCH_SIZE × N8N_TIMEOUT_SECONDS (5 × 10 s); com os 10 s padrão
    # do Docker, o SIGKILL chegaria no meio. Mudou um dos dois, reveja este valor.
    stop_grace_period: 1m
    depends_on:
      db: {condition: service_healthy}

  # E-mail do ambiente local (ADR-0006): o Keycloak manda o convite para cá, e o
  # Mailpit não entrega a ninguém, só mostra a mensagem em http://localhost:8025.
  # Versão fixa, como o n8n: com `latest`, cada máquina do time roda a versão do
  # dia em que baixou a imagem. Não existe em produção, onde o SMTP é o do Gmail.
  mailpit:
    image: axllent/mailpit:v1.31.1
    ports: ['8025:8025', '1025:1025']

volumes:
  pgdata:
  n8ndata:
