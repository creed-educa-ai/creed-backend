name: Imagem de produção

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  # O deploy roda `alembic upgrade head` no RDS: só segue se o CI deste mesmo commit
  # passar. Chamado aqui, e não esperado por `workflow_run`: esse usaria o arquivo e
  # a ref da dev, e a role da AWS, que só confia na main, recusaria o token.
  ci:
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  publicar:
    needs: ci
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      # O buildx é o que permite guardar as camadas no cache do Actions.
      - uses: docker/setup-buildx-action@v3

      - name: Entrar no GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Tag do commit inteiro, sem prefixo (é o que o deploy.sh recebe), e tag da
      # branch com `/` trocada por `-`: tag Docker não aceita `/`.
      - name: Montar tags e etiquetas
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=sha,format=long,prefix=
            type=ref,event=branch

      - name: Gerar e publicar a imagem arm64
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Só a main publica em produção. Rodado à mão em outra branch, o workflow para na
  # imagem — e a role da AWS também recusaria (ela só confia na main).
  deploy:
    needs: publicar
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # A fila vale só para o deploy: um teste à mão na dev não entra nela, e o build
    # roda livre. Se dois pushes na main chegam seguidos, o que espera na fila é
    # trocado pelo mais novo, que já leva tudo. A garantia de um deploy.sh por vez
    # mora no próprio script (flock), que cobre também o deploy rodado à mão.
    concurrency:
      group: deploy-producao
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write  # o crachá OIDC que a AWS troca pela role creed-github-deploy
    env:
      AWS_REGION: us-east-2
      EC2_INSTANCE_ID: ${{ vars.EC2_INSTANCE_ID }}

    steps:
      - name: Assumir a role de deploy na AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Rodar o deploy.sh na EC2 (Session Manager)
        run: |
          # Limites do lado da AWS coerentes com a espera daqui: até 2 min para a
          # EC2 receber o comando e até 9 min para ele rodar. Sem eles, o comando
          # seguiria vivo por até 1 h depois de este job desistir.
          PARAMETROS=$(jq -n --arg cmd \
            "sudo -iu ec2-user /opt/creed/creed-infrastructure/ec2/deploy.sh $GITHUB_SHA" \
            '{commands: [$cmd], executionTimeout: ["540"]}')
          ID=$(aws ssm send-command \
            --instance-ids "$EC2_INSTANCE_ID" \
            --document-name AWS-RunShellScript \
            --comment "deploy ${GITHUB_SHA::7}" \
            --timeout-seconds 120 \
            --parameters "$PARAMETROS" \
            --query Command.CommandId --output text)
          echo "comando $ID enviado"

          # Até 12 min: cobre os 2 + 9 acima, com folga.
          STATUS=Pending
          for _ in $(seq 72); do
            sleep 10
            if ! RESPOSTA=$(aws ssm get-command-invocation --command-id "$ID" \
                --instance-id "$EC2_INSTANCE_ID" --query Status --output text 2>&1); then
              # Nos primeiros segundos a AWS ainda não registrou o comando na
              # instância. Só esse erro é esperado; qualquer outro aparece aqui.
              case "$RESPOSTA" in
                *InvocationDoesNotExist*) echo "… aguardando a EC2 registrar o comando"; continue ;;
                *) echo "$RESPOSTA" >&2; exit 1 ;;
              esac
            fi
            STATUS="$RESPOSTA"
            case "$STATUS" in
              Pending|InProgress|Delayed) echo "… $STATUS" ;;
              *) break ;;
            esac
          done

          case "$STATUS" in
            Pending|InProgress|Delayed)
              echo "::error::o deploy passou de 12 min; cancelando o comando na EC2"
              aws ssm cancel-command --command-id "$ID" --instance-ids "$EC2_INSTANCE_ID"
              exit 1 ;;
          esac

          aws ssm get-command-invocation --command-id "$ID" --instance-id "$EC2_INSTANCE_ID" \
            --query '[StandardOutputContent, StandardErrorContent]' --output text
          echo "status final: $STATUS"
          [ "$STATUS" = "Success" ]
