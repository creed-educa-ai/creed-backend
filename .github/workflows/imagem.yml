name: Imagem de produção

on:
  push:
    branches: [main]
  workflow_dispatch:

# Espera, não cancela: o comando já enviado à EC2 continua rodando lá mesmo com o
# workflow cancelado, e dois deploy.sh juntos rodariam duas migrations em paralelo.
concurrency:
  group: imagem-producao
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Entrar no GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Gerar e publicar a imagem arm64
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/arm64
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:${{ github.sha }}
            ghcr.io/${{ github.repository }}:${{ github.ref_name }}

  # Só a main publica em produção. Rodado à mão em outra branch, o workflow para na
  # imagem — e a role da AWS também recusaria (ela só confia na main).
  deploy:
    needs: publicar
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write  # o crachá OIDC que a AWS troca pela role creed-github-deploy
    env:
      AWS_REGION: us-east-2
      EC2_INSTANCE_ID: i-0ef1575e5cd4b756e

    steps:
      - name: Assumir a role de deploy na AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Rodar o deploy.sh na EC2 (Session Manager)
        run: |
          ID=$(aws ssm send-command \
            --instance-ids "$EC2_INSTANCE_ID" \
            --document-name AWS-RunShellScript \
            --comment "deploy ${GITHUB_SHA::7}" \
            --parameters "commands=[\"sudo -iu ec2-user /opt/creed/creed-infrastructure/ec2/deploy.sh $GITHUB_SHA\"]" \
            --query Command.CommandId --output text)
          echo "comando $ID enviado"

          # Até 10 min: o primeiro deploy baixa a imagem inteira.
          for _ in $(seq 60); do
            sleep 10
            STATUS=$(aws ssm get-command-invocation --command-id "$ID" \
              --instance-id "$EC2_INSTANCE_ID" --query Status --output text 2>/dev/null || echo Pending)
            case "$STATUS" in
              Pending|InProgress|Delayed) echo "… $STATUS" ;;
              *) break ;;
            esac
          done

          aws ssm get-command-invocation --command-id "$ID" --instance-id "$EC2_INSTANCE_ID" \
            --query '[StandardOutputContent, StandardErrorContent]' --output text
          echo "status final: $STATUS"
          [ "$STATUS" = "Success" ]
