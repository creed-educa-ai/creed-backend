name: CI Back-end

on:
  # As duas branches permanentes: dev é o alvo dos PRs de tarefa, main recebe
  # o merge de release. `pull_request` sem filtro cobre PR para qualquer alvo.
  push:
    branches: [main, dev]
  pull_request:

jobs:
  qualidade:
    runs-on: ubuntu-latest

    # POSTGRES_PASSWORD e KEYCLOAK_CLIENT_SECRET não têm default na Settings
    # (ADR-002, secao 2.3) — sem eles qualquer import de app.core.config falha,
    # então valem para todos os steps. O valor aqui é descartável: nenhum teste
    # fala com Keycloak, só precisa que a Settings consiga ser construída.
    env:
      POSTGRES_USER: creed
      POSTGRES_PASSWORD: creed
      POSTGRES_DB: creed_test
      KEYCLOAK_CLIENT_SECRET: irrelevante-no-ci

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: creed
          POSTGRES_PASSWORD: creed
          POSTGRES_DB: creed_test
        options: >-
          --health-cmd pg_isready --health-interval 10s
          --health-timeout 5s --health-retries 5
        ports: ['5432:5432']

    steps:
      - uses: actions/checkout@v4
        with:
          # Histórico inteiro: o passo "migration só na consolidação" compara
          # o PR com origin/<base>, que um clone raso não tem.
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - run: pip install -e ".[dev]"

      - name: Ruff (lint)
        run: ruff check .

      - name: Ruff (formatação)
        run: ruff format --check .

      - name: Mypy (tipos, strict)
        run: mypy app

      - name: Alembic — checar heads únicas
        run: |
          HEADS=$(alembic heads | wc -l)
          if [ "$HEADS" -gt 1 ]; then
            echo "::error::Múltiplas heads do Alembic. Use 'alembic merge' (ADR-002, 2.4.c)."
            exit 1
          fi

      # ADR-0009: PR de tarefa sobe sem migration, e um AGES III consolida as
      # mudanças de banco da sprint numa branch *-consolidar-migrations. dev e
      # main como origem são release/back-merge e já trazem a consolidada.
      - name: Alembic — migration só na consolidação
        id: consolidacao
        if: github.event_name == 'pull_request'
        env:
          # Via env, não interpolado direto no script: nome de branch é
          # conteúdo controlado por quem abre o PR.
          BRANCH: ${{ github.head_ref }}
          BASE: ${{ github.base_ref }}
        run: |
          case "$BRANCH" in
            *-consolidar-migrations)
              echo "Branch de consolidação: pode trazer migration."
              echo "consolidar=sim" >> "$GITHUB_OUTPUT"
              exit 0 ;;
            dev|main)
              echo "Branch permanente ($BRANCH): nada a validar."
              exit 0 ;;
          esac

          ALTERADAS=$(git diff --name-only "origin/$BASE...HEAD" -- alembic/versions/)
          if [ -n "$ALTERADAS" ]; then
            echo "::error::PR de tarefa não traz migration (ADR-0009)."
            echo "$ALTERADAS"
            cat <<'AJUDA'

          A migration que você gerou serve para testar local. Antes de subir:
            alembic downgrade <head-da-dev>     # primeiro desce
            rm alembic/versions/<arquivo>.py    # depois apaga
          E descreva o que mudou no banco na seção "Banco" do PR.
          Detalhes na seção Migrations do README.
          AJUDA
            exit 1
          fi
          echo "Nenhuma migration no PR."

      # Só na consolidação: a cadeia inteira sobe num banco limpo e não sobra
      # diferença entre models.py e o schema.
      - name: Alembic — aplicar e conferir a consolidação
        if: steps.consolidacao.outputs.consolidar == 'sim'
        run: |
          alembic upgrade head
          alembic check

      - name: Pytest
        run: pytest
