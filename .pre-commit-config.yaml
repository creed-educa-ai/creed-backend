# Barra o problema na máquina de quem escreve (mesmo princípio do ADR-003).
repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.5
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files
      - id: check-merge-conflict
      - id: detect-private-key

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.13.0
    hooks:
      - id: mypy
        # O hook roda em ambiente proprio, isolado do .venv: tudo que os
        # arquivos checados importam precisa estar listado aqui, ou o mypy
        # acusa import-not-found em codigo correto.
        additional_dependencies:
          - pydantic
          - pydantic-settings
          - sqlalchemy
          - fastapi
          - alembic
          - pytest
          - httpx
          - pyjwt[crypto]
        args: [--strict]

  - repo: local
    hooks:
      # Só no push: o nome da branch não muda a cada commit, e travar o
      # commit por causa dele atrapalharia mais do que ajuda.
      - id: nome-da-branch
        name: nome da branch no padrao do CONTRIBUTING
        entry: python scripts/verificar_nome_da_branch.py
        # python, nao script: `language: script` depende do shebang, que o
        # Windows nao honra - e o time desenvolve no Windows.
        language: python
        stages: [pre-push]
        pass_filenames: false
        always_run: true
